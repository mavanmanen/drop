# ==============================================================================
# Docker Compose for Drop with PostgreSQL Database
#
# Usage:
#   docker compose -f docker-compose.postgres.yml up -d
# ==============================================================================

services:
  drop:
    build:
      context: .
      dockerfile: Dockerfile
    image: drop:latest
    container_name: drop-app
    restart: unless-stopped
    ports:
      - "${DROP_PORT:-5000}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Single admin account configuration
      - DROP_ADMIN_USERNAME=${DROP_ADMIN_USERNAME:-admin}
      - DROP_ADMIN_PASSWORD=${DROP_ADMIN_PASSWORD:-change-me-promptly}
      - DROP_JWT_SECRET=${DROP_JWT_SECRET:-drop_super_secret_gaming_clips_key_2026_dev_env_only!}

      # Database Configuration: PostgreSQL
      - DROP_DB_PROVIDER=postgres
      - DROP_POSTGRES_HOST=${DROP_POSTGRES_HOST:-postgres}
      - DROP_POSTGRES_PORT=${DROP_POSTGRES_PORT:-5432}
      - DROP_POSTGRES_DB=${DROP_POSTGRES_DB:-drop}
      - DROP_POSTGRES_USER=${DROP_POSTGRES_USER:-drop}
      - DROP_POSTGRES_PASSWORD=${DROP_POSTGRES_PASSWORD:-droppassword}

      # Default visibility for automatically ingested clips
      - DROP_INGEST_DEFAULT_VISIBILITY=${DROP_INGEST_DEFAULT_VISIBILITY:-public}

      # Gemini AI Video Analysis (optional)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
    develop:
      watch:
        # Rebuild container when backend source code or project file changes
        - action: rebuild
          path: ./backend/Drop.Api
          ignore:
            - bin/
            - obj/
            - wwwroot/
        # Rebuild container when frontend dependencies or config changes
        - action: rebuild
          path: ./frontend/package.json
        # Sync frontend source code and rebuild
        - action: rebuild
          path: ./frontend/src
        # Sync frontend public assets
        - action: rebuild
          path: ./frontend/public
        # Rebuild when Dockerfile changes
        - action: rebuild
          path: ./Dockerfile
    volumes:
      - ./data/ingest:/data/ingest
      - ./data/clips:/data/clips
      - ./data/thumbnails:/data/thumbnails
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    container_name: drop-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DROP_POSTGRES_DB:-drop}
      - POSTGRES_USER=${DROP_POSTGRES_USER:-drop}
      - POSTGRES_PASSWORD=${DROP_POSTGRES_PASSWORD:-droppassword}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U drop -d drop || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
