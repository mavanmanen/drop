# ==============================================================================
# Docker Compose for Drop with PostgreSQL Database
#
# Usage:
#   docker compose -f docker-compose.postgres.yml up -d
# ==============================================================================

services:
  drop:
    build:
      context: .
      dockerfile: Dockerfile
    image: drop:latest
    container_name: drop-app
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      # Single admin account configuration
      - DROP_ADMIN_USERNAME=admin
      - DROP_ADMIN_PASSWORD=change-me-promptly
      - DROP_JWT_SECRET=replace-with-a-random-32-char-secret-string

      # Storage directories inside container
      - DROP_DATA_DIR=/data
      - DROP_INGEST_PATH=/data/ingest
      - DROP_STORAGE_PATH=/data/clips

      # Database Configuration: PostgreSQL
      - DROP_DB_PROVIDER=postgres
      - DROP_POSTGRES_HOST=postgres
      - DROP_POSTGRES_PORT=5432
      - DROP_POSTGRES_DB=drop
      - DROP_POSTGRES_USER=drop
      - DROP_POSTGRES_PASSWORD=droppassword

      # Default visibility for automatically ingested clips
      - DROP_INGEST_DEFAULT_VISIBILITY=public
    volumes:
      - ./data/ingest:/data/ingest
      - ./data/clips:/data/clips
      - ./data/thumbnails:/data/thumbnails
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    container_name: drop-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=drop
      - POSTGRES_USER=drop
      - POSTGRES_PASSWORD=droppassword
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drop -d drop || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
