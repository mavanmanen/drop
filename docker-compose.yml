services:
  drop:
    build:
      context: .
      dockerfile: Dockerfile
    image: drop:latest
    container_name: drop-app
    restart: unless-stopped
    ports:
      - "${DROP_PORT:-5000}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Single admin account configuration
      - DROP_ADMIN_USERNAME=${DROP_ADMIN_USERNAME:-admin}
      - DROP_ADMIN_PASSWORD=${DROP_ADMIN_PASSWORD:-change-me-promptly}
      # Optional custom JWT secret (recommended for production)
      - DROP_JWT_SECRET=${DROP_JWT_SECRET:-drop_super_secret_gaming_clips_key_2026_dev_env_only!}
      # Storage and directory paths inside container
      - DROP_DATA_DIR=${DROP_DATA_DIR:-/data}
      - DROP_INGEST_PATH=${DROP_INGEST_PATH:-/data/ingest}
      - DROP_STORAGE_PATH=${DROP_STORAGE_PATH:-/data/clips}
      # Database configuration: 'sqlite' (default) or 'postgres'
      - DROP_DB_PROVIDER=${DROP_DB_PROVIDER:-sqlite}
      - DROP_DB_PATH=${DROP_DB_PATH:-/data/db/drop.db}
      # Default visibility for automatically ingested clips (public, unlisted, or private)
      - DROP_INGEST_DEFAULT_VISIBILITY=${DROP_INGEST_DEFAULT_VISIBILITY:-public}
      # Gemini AI Video Analysis (optional)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
    develop:
      watch:
        # Rebuild container when backend source code or project file changes
        - action: rebuild
          path: ./backend/Drop.Api
          ignore:
            - bin/
            - obj/
            - wwwroot/
        # Rebuild container when frontend dependencies or config changes
        - action: rebuild
          path: ./frontend/package.json
        # Sync frontend source code and rebuild
        - action: rebuild
          path: ./frontend/src
        # Sync frontend public assets
        - action: rebuild
          path: ./frontend/public
        # Rebuild when Dockerfile changes
        - action: rebuild
          path: ./Dockerfile
    volumes:
      # Ingest folder: Drop your gaming recordings/clips here to auto-import!
      - ./data/ingest:/data/ingest
      # Permanent storage for ingested and uploaded clips
      - ./data/clips:/data/clips
      # Generated video thumbnails
      - ./data/thumbnails:/data/thumbnails
      # SQLite database file
      - ./data/db:/data/db
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

