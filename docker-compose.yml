services:
  drop:
    build:
      context: .
      dockerfile: Dockerfile
    image: drop:latest
    container_name: drop-app
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      # Single admin account configuration
      - DROP_ADMIN_USERNAME=admin
      - DROP_ADMIN_PASSWORD=change-me-promptly
      # Optional custom JWT secret (recommended for production)
      - DROP_JWT_SECRET=replace-with-a-random-32-char-secret-string
      # Storage and directory paths inside container
      - DROP_DATA_DIR=/data
      - DROP_INGEST_PATH=/data/ingest
      - DROP_STORAGE_PATH=/data/clips
      # Database configuration: 'sqlite' (default) or 'postgres'
      - DROP_DB_PROVIDER=sqlite
      - DROP_DB_PATH=/data/db/drop.db
      # If using postgres, set:
      # - DROP_DB_PROVIDER=postgres
      # - DROP_POSTGRES_HOST=postgres
      # - DROP_POSTGRES_PORT=5432
      # - DROP_POSTGRES_DB=drop
      # - DROP_POSTGRES_USER=drop
      # - DROP_POSTGRES_PASSWORD=your-postgres-password
      # Or:
      # - DROP_DB_CONNECTION_STRING=Host=postgres;Port=5432;Database=drop;Username=drop;Password=secret
      # Default visibility for automatically ingested clips (public, unlisted, or private)
      - DROP_INGEST_DEFAULT_VISIBILITY=public
    volumes:
      # Ingest folder: Drop your gaming recordings/clips here to auto-import!
      - ./data/ingest:/data/ingest
      # Permanent storage for ingested and uploaded clips
      - ./data/clips:/data/clips
      # Generated video thumbnails
      - ./data/thumbnails:/data/thumbnails
      # SQLite database file
      - ./data/db:/data/db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

